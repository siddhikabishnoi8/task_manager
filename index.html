<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Task Manager Pro</h1>
            <div class="header-controls">
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Tasks</div>
                <div class="stat-value" id="totalTasks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedTasks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingTasks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Overdue</div>
                <div class="stat-value" id="overdueTasks">0</div>
            </div>
        </div>

        <div class="main-content">
            <aside class="sidebar">
                <h2>Add New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="taskTitle" required placeholder="Enter task title">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="taskDescription" placeholder="Add task details..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="taskCategory" required>
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <button type="submit" class="btn" id="submitBtn">Add Task</button>
                </form>
            </aside>

            <main>
                <div class="filters">
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all">All Tasks</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <div class="filter-group">
                        <button class="filter-btn" data-category="work">Work</button>
                        <button class="filter-btn" data-category="personal">Personal</button>
                        <button class="filter-btn" data-category="shopping">Shopping</button>
                        <button class="filter-btn" data-category="health">Health</button>
                        <button class="filter-btn" data-category="other">Other</button>
                    </div>
                    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search tasks...">
                </div>

                <div class="tasks-container" id="tasksContainer"></div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
